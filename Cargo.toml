[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/krilla", "vendor/hayro", "vendor/hayro-interpret", "vendor/hayro-syntax", "vendor/hayro-jbig2", "vendor/hayro-cmap", "vendor/hayro-postscript"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
craft-ai-core = { path = "crates/ai-core" }
craft-archive = { path = "crates/archive" }
craft-atomic = { path = "crates/atomic" }
craft-audio-rt = { path = "crates/audio-rt" }
craft-av1 = { path = "crates/av1" }
craft-bitstream = { path = "crates/bitstream" }
craft-bench = { path = "crates/bench" }
craft-blend = { path = "crates/blend" }
craft-blur = { path = "crates/blur" }
craft-bvh = { path = "crates/bvh" }
craft-cache = { path = "crates/cache" }
craft-cache-derive = { path = "crates/cache-derive" }
craft-cfb = { path = "crates/cfb" }
craft-cms = { path = "crates/cms" }
craft-compare = { path = "crates/compare" }
craft-corpus = { path = "crates/corpus" }
craft-crw = { path = "crates/crw" }
craft-dialogs = { path = "crates/dialogs" }
craft-diff = { path = "crates/diff" }
craft-distortion = { path = "crates/distortion" }
craft-doc = { path = "crates/doc" }
craft-docpath = { path = "crates/docpath" }
craft-ecproj-format = { path = "crates/ecproj-format" }
craft-fft = { path = "crates/fft" }
craft-font-catalog = { path = "crates/font-catalog" }
craft-font-manager = { path = "crates/font-manager" }
craft-font-store = { path = "crates/font-store" }
craft-fonts-build = { path = "crates/fonts-build" }
craft-fuzzy = { path = "crates/fuzzy" }
craft-h264 = { path = "crates/h264" }
craft-hash = { path = "crates/hash" }
craft-hevc = { path = "crates/hevc" }
craft-i18n = { path = "crates/i18n" }
craft-io = { path = "crates/io" }
craft-jpeg = { path = "crates/jpeg" }
craft-keymap = { path = "crates/keymap" }
craft-log = { path = "crates/log" }
craft-media = { path = "crates/media" }
craft-media-testkit = { path = "crates/media-testkit" }
craft-menu = { path = "crates/menu" }
craft-metafile = { path = "crates/metafile" }
craft-opus = { path = "crates/opus" }
craft-oracle = { path = "crates/oracle" }
craft-ooxml = { path = "crates/ooxml" }
craft-pcraft-format = { path = "crates/pcraft-format" }
craft-pdf = { path = "crates/pdf", version = "=0.1.0" }
craft-plate-test = { path = "crates/plate-test" }
craft-platform = { path = "crates/platform" }
craft-prepress = { path = "crates/prepress" }
craft-print = { path = "crates/print" }
craft-proof = { path = "crates/proof" }
craft-quit = { path = "crates/quit" }
craft-resample = { path = "crates/resample" }
craft-scopes = { path = "crates/scopes" }
craft-settings = { path = "crates/settings" }
craft-text = { path = "crates/text" }
craft-tiledir = { path = "crates/tiledir" }
craft-time = { path = "crates/time" }
craft-ui = { path = "crates/ui" }
craft-update = { path = "crates/update" }
craft-vectorcraft-format = { path = "crates/vectorcraft-format" }
craft-view = { path = "crates/view" }
craft-vp8 = { path = "crates/vp8" }
craft-vp9 = { path = "crates/vp9" }
craft-window = { path = "crates/window" }
craft-xtask = { path = "crates/xtask-lib" }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
hayro = { version = "=0.7.1", default-features = false }
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
bytemuck = "1"
kurbo = "0.13"
thiserror = "2"
egui = { version = "0.37", default-features = false }
emath = { version = "0.37", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate"] }
# SHA-256 (RustCrypto). Already used by craft-update, craft-font-store, craft-keymap and
# craft-crw's tests; craft-hash is the shared wrapper.
sha2 = "0.10"
realfft = "3.5.1"
rustdct = "0.7.1"
rustfft = "6.4.1"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Safe 128-bit SIMD for craft-distortion (NEON, SSE2, optional wasm SIMD128, scalar fallback).
# The workspace forbids unsafe, so this crate does not call core::arch. See crates/distortion/README.md.
wide = { version = "1.7.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package.craft-opus]
opt-level = 3

[patch.crates-io]
krilla = { path = "vendor/krilla" }

hayro = { path = "vendor/hayro" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }

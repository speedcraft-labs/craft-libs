Section "ServerFlags"
  Option "AutoAddGPU" "false"
  Option "AutoEnableDevices" "false"
EndSection
Section "Device"
  Identifier "GPU0"
  Driver "nvidia"
  BusID "PCI:1:0:0"
  Option "AllowEmptyInitialConfiguration" "true"
  Option "UseDisplayDevice" "None"
EndSection
Section "Screen"
  Identifier "Screen0"
  Device "GPU0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Virtual 1920 1080
  EndSubSection
EndSection
Section "ServerLayout"
  Identifier "Layout0"
  Screen 0 "Screen0"
EndSection

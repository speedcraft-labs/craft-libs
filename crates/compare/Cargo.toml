[package]
name = "craft-compare"
description = "Shared comparison metrics for every output kind: bytes, images (PSNR/SSIM/CIEDE2000), audio, canonical XML, text, numbers, and uniform verdicts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# `write_diff_png`: render an amplified per-pixel difference as a PNG.
png = ["dep:png"]
# `package::Package::from_zip`: read ZIP/OPC packages through craft-archive.
zip = ["dep:craft-archive"]
# `package::Package::from_cfb`: read CFB/OLE2 packages through craft-cfb.
cfb = ["dep:craft-cfb"]

[dependencies]
craft-archive = { workspace = true, optional = true }
craft-cfb = { workspace = true, optional = true }
png = { version = "0.18", optional = true }

[dev-dependencies]
craft-archive = { workspace = true }

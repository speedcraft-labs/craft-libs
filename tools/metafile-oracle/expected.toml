# Intended old-vs-new differences of the craft-metafile swaps (#92), over the Office corpus.
# DeckCraft entries match by file; WordCraft entries match by the class the masking ladder
# attributes the difference to (the `metric`), see `attribute` in tests/metafile_oracle.rs.
# An entry that matches nothing is reported as stale. Counts, root causes and the evidence behind
# each entry: docs/verification/metafile-oracle.md.

[[expected]]
id = "deckcraft-xor-mask-gradient"
metric = "deckcraft/xor-mask-gradient"
reason = "FIXED: 3 LibreOffice metafiles now turn identical R2_XORPEN polygon passes around one R2_COPYPEN mask into a gradient clipped to the mask. The previous shared reader dropped both XOR passes and kept only the solid mask."
evidence = "crates/metafile/src/tests.rs libreoffice_xor_mask_gradients_become_masked_bitmaps; LibreOffice render of WPC_MulticolorGradient.docx; docs/verification/metafile-oracle.md section 'R2_XORPEN'"

[[expected]]
id = "deckcraft-xor-mask-wmf"
glob = "deckcraft/5fd296fc7f2ccf69da8d11b597d1d5e4b1a8bc8753c7f5c77a9920f272ec15e7.wmf"
metric = "records"
reason = "FIXED: the tdf110440 WMF contains the same repeated XOR-mask idiom. craft-metafile replaces its solid triangular mask with the clipped output of the XOR pass."
evidence = "crates/metafile/src/tests.rs libreoffice_xor_mask_gradients_become_masked_bitmaps; #205"

[[expected]]
id = "deckcraft-extent-scaling"
metric = "deckcraft/extent-scaling"
reason = "1 file (office-poi spreadsheet/60460.xls, Workbook stream) scales its viewport with EMR_SCALEVIEWPORTEXTEX (700/3456, 250/844) after setting the window extent. The shared reader honours records 31/32 (added from VectorCraft, #92); the pre-swap DeckCraft reader ignored them and placed every later text run 4.9x too far right (x = 1691 pt in a 490 pt wide picture). The device bounds the writer stored in EMR_EXTTEXTOUTW (387..396 px for logical x = 290) fit the scaled mapping (290 x 4/3 = 387)."
evidence = "cloudbring/artcraft-algorithms#92 (extent scaling 31/32); MS-EMF 2.3.11 EMR_SCALEVIEWPORTEXTEX; docs/verification/metafile-oracle.md section 'DeckCraft'"

[[expected]]
id = "deckcraft-select-clip-region"
metric = "deckcraft/select-clip-region"
reason = "6 WMF files. META_SELECTCLIPREGION (0x012C) with the null region restores the default clip after each INTERSECTCLIPRECT (Office writes it around every clipped text run). Neither the pre-swap DeckCraft reader nor the first draft of craft-metafile handled it, so the clip rectangle of the first clipped run stayed in force and dropped later shapes. This oracle found it; craft-metafile now resets the clip (red-then-green test wmf_select_clip_region_restores_the_default_clip), and the old DeckCraft output was the bug. With the 0x012C records masked, old and new are identical."
evidence = "MS-WMF 2.3.5.? META_SELECTCLIPREGION; crates/metafile/src/tests.rs wmf_select_clip_region_restores_the_default_clip; docs/verification/metafile-oracle.md section 'DeckCraft'"

[[expected]]
id = "wordcraft-gap-records"
metric = "gap-records"
reason = "WMF files only. The pre-swap WordCraft reader skipped records the shared reader plays: WMF text (TEXTOUT, EXTTEXTOUT with font, colour and alignment state), PATBLT fills, clip rectangles. Replacing those records by no-ops in the input of both sides makes old and new identical (850 files); no other record family is involved."
evidence = "crates/metafile/COVERAGE.md (WordCraft column: `-` for 0x0521, 0x0A32, 0x061D, 0x0415/6, 0x012E, 0x0209); #92 comment 'Consumer implemented: wordcraft'"

[[expected]]
id = "wordcraft-xorpen-mix"
metric = "gap-records+rop2"
reason = "FIXED: on 3 LibreOffice metafiles, the pre-swap WordCraft reader drew the XOR polygons as copies (leaking the gradient outside the mask), while the initial shared reader drew only the solid mask. craft-metafile now recognizes identical XOR polygon passes around the copy mask and emits the clipped gradient."
evidence = "crates/metafile/src/tests.rs libreoffice_xor_mask_gradients_become_masked_bitmaps; LibreOffice render of WPC_MulticolorGradient.docx; docs/verification/metafile-oracle.md section 'R2_XORPEN'"


[[expected]]
id = "wordcraft-text-face-name-nul"
metric = "gap-records+rop2+text-drawing/face-name-nul"
reason = "The pre-swap reader kept the whole 32-character LOGFONT face name, including the bytes after the terminating NUL, so the name was 'Arial<garbage>' and no font resolved (fallback face). The shared reader trims at the NUL. The records are otherwise equal."
evidence = "MS-EMF 2.2.13 LogFont: FaceName is a NUL-terminated string in a 32-element array; docs/verification/metafile-oracle.md section 'Text'"

[[expected]]
id = "wordcraft-text-affine-over-1pct"
metric = "gap-records+rop2+text-drawing/affine-scale-over-1pct"
reason = "Text runs of files whose logical-to-picture scale differs by more than 1% between x and y. The pre-swap text model had one isotropic size (the y scale) and positioned glyphs by the dx array scaled in x, so glyphs ran into each other when x < y and spread when x > y. The shared model carries the full affine, so the glyphs scale with their advances. Both the records (position, size, dx, angle in the projection) and the dx are equal; only the glyph x scale differs."
evidence = "#92 ('shared text font/affine fields mapped'); COVERAGE.md 'DeckCraft's richer text transformations ... remain'; docs/verification/metafile-oracle.md section 'Text'"

[[expected]]
id = "wordcraft-text-affine-up-to-1pct"
metric = "gap-records+rop2+text-drawing/affine-scale-up-to-1pct"
reason = "As wordcraft-text-affine-over-1pct with x and y scales within 1% of each other: the glyph x scale now follows the file's own scale, shifting glyph edges by a fraction of a pixel (worst case 74/255 on one edge pixel of a very large glyph, SSIM >= 0.9996)."
evidence = "docs/verification/metafile-oracle.md section 'Text'"

[[expected]]
id = "wordcraft-text-float-rounding"
metric = "gap-records+rop2+text-drawing/float-rounding"
reason = "Isotropic text (x and y scale equal to 1e-6) whose projected records are equal. The glyph transform is built in f64 from the logical font height and the affine (shared) instead of f32 from a pre-scaled size (pre-swap), so antialiased edge pixels differ by at most 1/255 on a handful of pixels (at most 1.3e-5 of the image, dE_max 0.86)."
evidence = "docs/verification/metafile-oracle.md section 'Text'"


# Intended old-vs-new differences of the craft-archive zip swap (#120) and the craft-cfb swap (#123),
# over the Office corpus and the hostile synthetic inputs of tools/container-oracle.
#
# Entries are matched per scenario: every `glob` starts with the scenario name (`<scenario>/...` for the
# corpus, `<scenario>.hostile/...` for the generated hostile cases). Corpus differences are registered
# one file at a time (except classes that cover most of the corpus); hostile ones per scenario and
# metric. An entry that matches nothing is reported as stale. Root causes and counts per entry:
# docs/verification/container-oracle.md. The file is generated from a reviewed run (no hand edits
# should widen a glob without a root cause).

[[expected]]
id = "craftdoc-pcraft.hostile:info-err-variant-outline-err-variant-renditions-err-variant-sniff-err-variant"
reason = "ZIP-layer differences on corrupted .pcraft bundles (byte flips and header-field sweeps over a valid bundle, truncations, trailing garbage). New is stricter: ZipGuard validates every entry name, declared size and the end record at open, so a bundle with one unsafe/NUL name or a flipped disk number in an entry the call never reads now fails (pc/zip-field/0930-zero: name \"\\0\\0umb.png\"; pc/zip-flip/1075: multi-disk), and a stream longer than its declared size fails (pc/zip-flip/0907). New is more tolerant: the zip crate finds the end record through trailing garbage and recovers from a damaged header the hand-written parser refused (pc/zip/trailing-garbage; pc/zip-flip/0059 keeps the sniff). No valid bundle differs: craftdoc-raw and craftdoc-wrapped agree on every corpus file but the three backslash-named ones."
evidence = "#120 consumer comments (pdfcraft/effectcraft/vectorcraft/craft-doc swaps); docs/verification/container-oracle.md; crates/doc/tests/hostile.rs"
glob = "craftdoc-pcraft.hostile/**"
metric = "info_err_variant+outline_err_variant+renditions_err_variant+sniff_err_variant"


name: Fuzzy matcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/fuzzy/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/fuzzy.yml']
  pull_request:
    paths: ['crates/fuzzy/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/fuzzy.yml']
permissions:
  contents: read
jobs:
  fuzzy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p craft-fuzzy --all-targets --locked -- -D warnings
      - run: cargo test -p craft-fuzzy --locked
      - run: cargo check -p craft-fuzzy --target wasm32-unknown-unknown --locked

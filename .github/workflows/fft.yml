name: FFT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/fft/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/fft.yml']
  pull_request:
    paths: ['crates/fft/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/fft.yml']

permissions:
  contents: read

jobs:
  fft:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt -p craft-fft --check
      - run: cargo clippy -p craft-fft --all-targets --locked -- -D warnings
      - run: cargo test -p craft-fft --locked
      - run: cargo doc -p craft-fft --no-deps --locked
      - run: cargo check -p craft-fft --locked --target wasm32-unknown-unknown

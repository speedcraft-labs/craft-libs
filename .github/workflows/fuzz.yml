name: Fuzz

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/h264/**"
      - "crates/hevc/**"
      - "crates/vp8/**"
      - "crates/vp9/**"
      - "crates/av1/**"
      - "crates/metafile/**"
      - "crates/archive/**"
      - "crates/pdf/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.crate }} / ${{ matrix.target }}
    runs-on: [self-hosted, agentbox]
    concurrency:
      group: fuzz-${{ github.workflow }}-${{ github.ref }}-${{ matrix.crate }}-${{ matrix.target }}
      cancel-in-progress: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: h264
            target: decode
          - crate: hevc
            target: decode
          - crate: vp8
            target: decode
          - crate: vp9
            target: decode
          - crate: av1
            target: decode
          - crate: metafile
            target: parse
          - crate: archive
            target: zip
          - crate: pdf
            target: open
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: /jobs/work/speedcraft-labs/targets/fuzzers-200-craft-libs
      CARGO_TERM_COLOR: always
      FUZZ_CORPUS_ROOT: /jobs/work/speedcraft-labs/fuzz-corpus/craft-libs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: nice -n 19 cargo +nightly install cargo-fuzz --locked
      - name: Prepare corpus and artifact paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          corpus="$FUZZ_CORPUS_ROOT/${{ matrix.crate }}/${{ matrix.target }}"
          artifacts="$RUNNER_TEMP/fuzz-artifacts/${{ matrix.crate }}-${{ matrix.target }}"
          mkdir -p "$corpus" "$artifacts"
          echo "corpus=$corpus" >> "$GITHUB_OUTPUT"
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"
          # Seed with checked-in fixture files when a target has no persistent corpus yet.
          if [ -z "$(find "$corpus" -type f -print -quit)" ]; then
            case "${{ matrix.crate }}" in
              h264) cp crates/h264/tests/data/determinism-main-cabac-b.h264 "$corpus/" ;;
              hevc) cp crates/hevc/tests/data/determinism-bframes.hevc "$corpus/" ;;
              metafile)
                for seed in crates/metafile/tests/fixtures/*.hex; do
                  python3 -c 'from pathlib import Path; import sys; Path(sys.argv[2]).write_bytes(bytes.fromhex(Path(sys.argv[1]).read_text()))' \
                    "$seed" "$corpus/$(basename "${seed%.hex}")"
                done ;;
              pdf) find /jobs/work/speedcraft-labs/hyper/corpus -type f -iname '*.pdf' -size -4M | head -n 12 | while IFS= read -r seed; do cp -n "$seed" "$corpus/"; done || true ;;
              archive) find /jobs/work/speedcraft-labs/hyper/corpus -type f \( -iname '*.zip' -o -iname '*.xlsx' -o -iname '*.docx' -o -iname '*.pptx' \) -size -8M | head -n 32 | while IFS= read -r seed; do cp -n "$seed" "$corpus/"; done || true ;;
              *) ;;
            esac
          fi
      - name: Fuzz (60 second PR smoke, 10 minute nightly budget)
        id: fuzz
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then budget=60; else budget=600; fi
          cd "crates/${{ matrix.crate }}"
          nice -n 19 cargo +nightly fuzz run "${{ matrix.target }}" "${{ steps.paths.outputs.corpus }}" -- \
            -max_len=4194304 -max_total_time="$budget" \
            -artifact_prefix="${{ steps.paths.outputs.artifacts }}/"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Minimize crash reproducers
        if: always()
        shell: bash
        run: |
          set +e
          cd "crates/${{ matrix.crate }}"
          mkdir -p "${{ steps.paths.outputs.artifacts }}/minimized"
          while IFS= read -r -d '' crash; do
            nice -n 19 cargo +nightly fuzz tmin "${{ matrix.target }}" "$crash" -- -max_total_time=60 -artifact_prefix="${{ steps.paths.outputs.artifacts }}/minimized/"
          done < <(find "${{ steps.paths.outputs.artifacts }}" -type f -name 'crash-*' -print0)
          nice -n 19 cargo +nightly fuzz cmin "${{ matrix.target }}" "${{ steps.paths.outputs.corpus }}" -- -max_total_time=60
      - name: Upload crash reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.crate }}-${{ matrix.target }}
          path: ${{ steps.paths.outputs.artifacts }}
          if-no-files-found: ignore
      - name: Fail when fuzzing found a crash
        if: steps.fuzz.outputs.exit_code != '0'
        run: exit 1

name: Hosted CI
on:
  push:
    branches: ['algo/**']
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  checks:
    # Keep the native dependency set on LTS; latest26.04 failed apt DNS/archives.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont
      - name: Fetch pinned PDF test fonts
        run: |
          font_dir="$RUNNER_TEMP/craft-pdf-test-fonts"
          python3 scripts/fetch-pdf-test-fonts.py "$font_dir"
          echo "CRAFT_PDF_TEST_FONT_DIR=$font_dir" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast

  rustgpu-shader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-15
          components: rust-src, rustc-dev, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p craft-gpu-blur --features spirv
      - run: cargo check -p craft-gpu-blur --features gpu-runner --example box_blur_pilot
      - run: rustup target add wasm32-unknown-unknown --toolchain nightly-2026-08-15
      - run: cargo build -p craft-gpu-blur --features spirv --target wasm32-unknown-unknown

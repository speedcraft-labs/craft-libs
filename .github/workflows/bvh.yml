name: Mesh BVH

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/bvh/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/bvh.yml']
  pull_request:
    paths: ['crates/bvh/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/bvh.yml']

permissions:
  contents: read

jobs:
  bvh:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are kept for releases: macOS runs only when started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p craft-bvh --all-targets --locked -- -D warnings
      - run: cargo test -p craft-bvh --locked -- --nocapture
      - run: cargo check -p craft-bvh --locked --target wasm32-unknown-unknown

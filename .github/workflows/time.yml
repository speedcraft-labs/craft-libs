name: Time

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/time/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/time.yml']
  pull_request:
    paths: ['crates/time/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/time.yml']

permissions:
  contents: read

jobs:
  time:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p craft-time --all-targets --locked -- -D warnings
      - run: cargo test -p craft-time --locked
      - run: cargo doc -p craft-time --no-deps --locked
      - run: cargo check -p craft-time --target wasm32-unknown-unknown --locked

name: Bounded file reads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/io/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/io.yml']
  pull_request:
    paths: ['crates/io/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/io.yml']

permissions:
  contents: read

jobs:
  io:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -p craft-io --all-targets --locked -- -D warnings
      - run: cargo test -p craft-io --locked
      - run: cargo doc -p craft-io --no-deps --locked

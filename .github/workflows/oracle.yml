name: Oracle

on:
  push:
    branches: [main]
    paths: ["crates/oracle/**", "Cargo.toml", "Cargo.lock", ".github/workflows/oracle.yml"]
  pull_request:
    paths: ["crates/oracle/**", "Cargo.toml", "Cargo.lock", ".github/workflows/oracle.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p craft-oracle --check
      - run: cargo clippy -p craft-oracle --all-targets --locked -- -D warnings
      - run: cargo test -p craft-oracle --locked

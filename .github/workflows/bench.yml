name: Bench harness
on:
  push:
    branches: ['algo/**']
    paths:
      - 'crates/bench/**'
      - 'crates/*/benches/**'
      - 'crates/*/tests/bench.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, agentbox]
            cargo_home: /home/ghrunner/.cargo
            cargo_bin: /home/ghrunner/.cargo/bin
          - runner: [self-hosted, mini]
            cargo_home: /Users/emm/.cargo
            cargo_bin: /opt/homebrew/bin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_HOME: ${{ matrix.cargo_home }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use preinstalled toolchains
        shell: bash
        run: |
          echo "${{ matrix.cargo_bin }}" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Check benchmark harness
        run: cargo test -p craft-bench -p craft-distortion --no-fail-fast

name: Bench harness
on:
  push:
    branches: ['algo/**']
    paths:
      - 'crates/bench/**'
      - 'crates/*/benches/**'
      - 'crates/*/tests/bench.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  bench:
    runs-on: [self-hosted, agentbox]
    env:
      CARGO_HOME: /home/ghrunner/.cargo
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target/${{ github.run_id }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use preinstalled toolchains
        shell: bash
        run: |
          echo /home/ghrunner/.cargo/bin >> "$GITHUB_PATH"
      - name: Check benchmark harness
        run: cargo test -p craft-bench --no-fail-fast

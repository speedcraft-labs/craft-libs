name: Bench harness
on:
  push:
    branches: ['algo/**']
    paths:
      - 'crates/bench/**'
      - 'crates/*/benches/**'
      - 'crates/*/tests/bench.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: [self-hosted, agentbox]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check benchmark harness
        run: cargo test --locked -p craft-bench --no-fail-fast

name: Blend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/blend/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/blend.yml']
  pull_request:
    paths: ['crates/blend/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/blend.yml']

permissions:
  contents: read

jobs:
  blend:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt -p craft-blend --check
      - run: cargo clippy -p craft-blend --all-targets --locked -- -D warnings
      - run: cargo test -p craft-blend --locked -- --nocapture
      - run: cargo doc -p craft-blend --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check -p craft-blend --target wasm32-unknown-unknown --locked

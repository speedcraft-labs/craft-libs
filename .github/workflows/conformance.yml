name: Codec conformance
on:
  push:
    branches: ['algo/**']
    paths:
      - 'crates/conformance/**'
      - 'crates/corpus/manifests/conformance-*.toml'
      - 'crates/h264/**'
      - 'crates/hevc/**'
      - 'crates/vp8/**'
      - 'crates/vp9/**'
      - 'crates/av1/**'
      - 'crates/bitstream/**'
      - 'crates/media/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: [self-hosted, agentbox]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        codec: [h264, hevc, vp8, vp9, av1]
    env:
      CRAFT_CORPUS_REQUIRE: '1'
      CRAFT_CORPUS_DIR: /jobs/work/speedcraft-labs/hyper/corpus
      CRAFT_AV1_HOSTILE_TIMEOUT_SECS: '3600'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conformance
        run: cargo test --locked --release -p craft-conformance --test ${{ matrix.codec }} -- --nocapture

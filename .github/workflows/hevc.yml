name: Shared HEVC

on:
  push:
    branches: [main]
    paths: ["crates/hevc/**", "crates/bitstream/**", "crates/media/**", "crates/media-testkit/**", "Cargo.toml", "Cargo.lock", ".github/workflows/hevc.yml"]
  pull_request:
    paths: ["crates/hevc/**", "crates/bitstream/**", "crates/media/**", "crates/media-testkit/**", "Cargo.toml", "Cargo.lock", ".github/workflows/hevc.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-hevc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 45
    name: HEVC lint, conformance, docs, WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-hevc
      - name: Install the external conformance oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx265
          ffprobe -version
      - run: cargo fmt -p craft-hevc --check
      - run: cargo clippy -p craft-hevc --all-targets --locked -- -D warnings
      - run: cargo test -p craft-hevc --locked --lib --test it
        env:
          CRAFT_MEDIA_REQUIRE_ORACLES: "1"
      - name: Hostile-input tests (optional libkvazaar seed)
        run: cargo test -p craft-hevc --locked --test fuzz_hostile
      - run: cargo test -p craft-hevc --locked --doc
      - run: cargo doc -p craft-hevc --no-deps --locked
      - run: cargo check -p craft-hevc --locked --target wasm32-unknown-unknown
      - run: cargo check -p craft-hevc --locked --no-default-features --target wasm32-unknown-unknown

name: Shared View
on:
  push:
    branches: [main]
    paths: ["crates/view/**", "Cargo.toml", "Cargo.lock", ".github/workflows/view.yml"]
  pull_request:
    paths: ["crates/view/**", "Cargo.toml", "Cargo.lock", ".github/workflows/view.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p craft-view --check
      - run: cargo clippy -p craft-view --all-targets --locked -- -D warnings
      - run: cargo test -p craft-view --locked
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p craft-view --locked --target wasm32-unknown-unknown

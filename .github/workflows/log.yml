name: Log
on:
  push:
    branches: [main]
    paths: ["crates/log/**", "Cargo.toml", "Cargo.lock", ".github/workflows/log.yml"]
  pull_request:
    paths: ["crates/log/**", "Cargo.toml", "Cargo.lock", ".github/workflows/log.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt -p craft-log --check
      - run: cargo clippy -p craft-log --all-targets --locked -- -D warnings
      - run: cargo test -p craft-log --locked
      - run: cargo doc -p craft-log --no-deps --locked
      - run: cargo check -p craft-log --target wasm32-unknown-unknown --locked
